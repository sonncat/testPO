services:
  jenkins:
    build: .
    container_name: jenkins-openbmc
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../:/workspace
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    devices:
      - /dev/kvm:/dev/kvm

volumes:
  jenkins_home: